name: HTTP result control comparison

on:
  workflow_dispatch:
  push:
    branches:
      - feature/http-result-control

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: football
            sport: futbol
            package: com.example
          - module: basketball
            sport: basketbol
            package: com.basketbol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sukrutureli/fathertahmin
          ref: main
          path: published
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml
      - name: Compare finished scores and verify settlement rules
        working-directory: ${{ matrix.module }}
        run: >-
          mvn clean compile exec:java
          -Dexec.mainClass=${{ matrix.package }}.scraper.ResultApiSmoke
          -Dexec.args="../published/${{ matrix.sport }}/data/MatchInfo-2026-09-29.json ../published/${{ matrix.sport }}/data/RealScores-2026-09-29.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.module }}-http-control-results
          path: ${{ matrix.module }}/http-control-results.json
          if-no-files-found: ignore
