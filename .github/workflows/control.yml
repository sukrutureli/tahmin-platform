name: Control

on:
  workflow_dispatch:
  # Enable after the first manual production publish succeeds.
  # schedule:
  #   - cron: '0 23,4,16,19 * * *'

permissions:
  contents: read

jobs:
  seed-production-data:
    name: Seed current production data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current published data
        uses: actions/checkout@v4
        with:
          repository: sukrutureli/fathertahmin
          ref: main
          path: published
      - name: Upload football data seed
        uses: actions/upload-artifact@v4
        with:
          name: football-control-seed
          path: published/futbol/data/
          if-no-files-found: error
      - name: Upload basketball data seed
        uses: actions/upload-artifact@v4
        with:
          name: basketball-control-seed
          path: published/basketbol/data/
          if-no-files-found: error

  football-control:
    name: Football CONTROL
    needs: seed-production-data
    runs-on: ubuntu-latest
    container:
      image: selenium/standalone-chrome:4.14.1-20231025
      options: --user root --shm-size=4gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: football/pom.xml
      - run: apt-get update && apt-get install -y maven
      - name: Restore current football data
        uses: actions/download-artifact@v4
        with:
          name: football-control-seed
          path: football/public/data
      - name: Run football CONTROL
        working-directory: football
        run: mvn clean compile exec:java -Dexec.args="kontrol"
      - uses: actions/upload-artifact@v4
        with:
          name: football-control-public
          path: football/public/
          if-no-files-found: error

  basketball-control:
    name: Basketball CONTROL
    needs: seed-production-data
    runs-on: ubuntu-latest
    container:
      image: selenium/standalone-chrome:4.14.1-20231025
      options: --user root --shm-size=4gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: basketball/pom.xml
      - run: apt-get update && apt-get install -y maven
      - name: Restore current basketball data
        uses: actions/download-artifact@v4
        with:
          name: basketball-control-seed
          path: basketball/public/data
      - name: Run basketball CONTROL
        working-directory: basketball
        run: mvn clean compile exec:java -Dexec.args="kontrol"
      - uses: actions/upload-artifact@v4
        with:
          name: basketball-control-public
          path: basketball/public/
          if-no-files-found: error

  publish:
    name: Publish CONTROL updates
    needs: [football-control, basketball-control]
    runs-on: ubuntu-latest
    steps:
      - name: Download football CONTROL output
        uses: actions/download-artifact@v4
        with:
          name: football-control-public
          path: publish/futbol
      - name: Download basketball CONTROL output
        uses: actions/download-artifact@v4
        with:
          name: basketball-control-public
          path: publish/basketbol
      - name: Publish atomically to fathertahmin
        env:
          TOKEN: ${{ secrets.ADMIN_USER }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ADMIN_USER secret is missing in tahmin-platform."
            exit 1
          fi

          git clone "https://x-access-token:${TOKEN}@github.com/sukrutureli/fathertahmin.git" target-repo
          cp -r publish/futbol/* target-repo/futbol/
          cp -r publish/basketbol/* target-repo/basketbol/

          cd target-repo
          git config user.name "Şükrü Türeli"
          git config user.email "sukrutureli@gmail.com"
          git add futbol basketbol

          if git diff --cached --quiet; then
            echo "No CONTROL changes to publish."
            exit 0
          fi

          git commit -m "📦 [TAHMIN-PLATFORM] CONTROL update ($(date +'%Y-%m-%d %H:%M'))"
          git push origin main

# fathertahmin keeps Telegram delivery; one combined commit prevents football
# and basketball CONTROL jobs from racing each other while publishing.
