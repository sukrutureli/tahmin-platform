name: Ensemble Market Validation (Artifacts Only)
run-name: Ensemble ${{ inputs.mode || 'auto' }} ${{ inputs.target_date || 'settings' }} [${{ inputs.production_run_id || 'manual' }}]
'on':
  push:
    branches:
    - main
    paths:
    - .github/mobile-detail-request.json
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily: predictions and training; control: frozen forecasts and HTTP results only'
        type: choice
        options:
        - daily
        - control
        default: daily
      target_date:
        description: Optional YYYY-MM-DD; defaults to experiment settings
        type: string
      source_run_id:
        description: Optional successful source run; control defaults to latest artifact for the date
        type: string
      published_ref:
        description: Verified private input commit SHA
        type: string
      missing_only:
        description: Refresh only outcomes not previously confirmed by HTTP
        type: boolean
        default: false
      production_run_id:
        description: Idempotent production run key
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: ensemble-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  primary:
    name: Primary forecast and immediate HTML
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (inputs.target_date != '' && inputs.source_run_id != '' &&
      inputs.published_ref != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 65
    outputs:
      target_date: ${{ steps.cfg.outputs.target_date }}
      published_ref: ${{ steps.cfg.outputs.published_ref }}
      previous_run_id: ${{ steps.cfg.outputs.previous_run_id }}
      previous_artifact: ${{ steps.cfg.outputs.previous_artifact }}
      run_mode: ${{ steps.cfg.outputs.run_mode }}
      refresh_flag: ${{ steps.cfg.outputs.refresh_flag }}
      checkpoint_recovery: ${{ steps.cfg.outputs.checkpoint_recovery }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Use the promoted replay implementation on this runner
      run: "for sport in football basketball; do\n  rsync -a --delete \"promoted/replay/$sport/src/\" \"$sport/src/\"\n  cp \"promoted/replay/$sport/pom.xml\"\
        \ \"$sport/pom.xml\"\ndone\ncp promoted/artifact.py scripts/privacy/artifact.py\n"
    - name: Resolve presentation refresh request
      if: github.event_name == 'push'
      run: "python3 - <<'PY'\nimport json,os,re\nr=json.load(open('.github/mobile-detail-request.json'))\nassert re.fullmatch(r'\\d{4}-\\\
        d{2}-\\d{2}',r['date']) and r['source'].isdigit() and re.fullmatch(r'[0-9a-f]{40}',r['published'])\nwith open(os.environ['GITHUB_ENV'],'a')\
        \ as out:\n    for k,v in {'REPORT_MODE':'control','REPORT_DATE':r['date'],'REPORT_SOURCE':r['source'],'REPORT_PUBLISHED':r['published']}.items():out.write(k+'='+v+'\\\
        n')\nPY\n"
    - name: Require private artifact key
      env:
        PRIVATE_ARTIFACT_KEY: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
      run: "python3 - <<'PYKEY'\nimport os, base64\ntry:\n k=base64.b64decode(os.environ.get(\"PRIVATE_ARTIFACT_KEY\", \"\"),validate=True)\n\
        \ assert len(k)==32\nexcept Exception:\n raise SystemExit(\"Configure PRIVATE_ARTIFACT_KEY before enabling this workflow\")\n\
        PYKEY\n"
    - name: Resolve experimental day and frozen source
      id: cfg
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_MODE: ${{ inputs.mode || env.REPORT_MODE }}
        INPUT_TARGET_DATE: ${{ inputs.target_date || env.REPORT_DATE }}
        INPUT_SOURCE_RUN: ${{ inputs.source_run_id || env.REPORT_SOURCE }}
        INPUT_PUBLISHED_REF: ${{ inputs.published_ref || env.REPORT_PUBLISHED }}
        INPUT_MISSING_ONLY: ${{ inputs.missing_only }}
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/control_runtime.py config --settings experiments/ensemble_validation/experiment-settings.json

        PRIVATE_COMMAND

        '
    - uses: actions/checkout@v4
      if: steps.cfg.outputs.run_mode != 'control'
      with:
        repository: sukrutureli/fathertahmin
        ref: ${{ steps.cfg.outputs.published_ref }}
        path: published
        persist-credentials: false
        token: ${{ secrets.FATHERTAHMIN_READ_TOKEN || secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}
    - uses: actions/checkout@v4
      if: steps.cfg.outputs.run_mode != 'control'
      with:
        repository: sukrutureli/fathertahmin
        ref: 700bc50bd7b63a616a8b9a61d4aa6de2f7e2a14c
        path: archive
        persist-credentials: false
        token: ${{ secrets.FATHERTAHMIN_READ_TOKEN || secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}
    - uses: ./.github/actions/private-download
      with:
        name: ${{ steps.cfg.outputs.previous_artifact }}
        run-id: ${{ steps.cfg.outputs.previous_run_id }}
        github-token: ${{ github.token }}
        path: previous
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - uses: ./.github/actions/private-download
      if: steps.cfg.outputs.run_mode != 'control' && (hashFiles('previous/rule-mining-dataset.json') == '')
      with:
        name: ensemble-market-validation-2026-10-03
        run-id: 37182748093
        github-token: ${{ github.token }}
        path: rule-bootstrap/0
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - uses: ./.github/actions/private-download
      if: steps.cfg.outputs.run_mode != 'control' && (hashFiles('previous/rule-mining-dataset.json') == '')
      with:
        name: ensemble-market-validation-2026-10-05
        run-id: 37422557787
        github-token: ${{ github.token }}
        path: rule-bootstrap/1
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - uses: ./.github/actions/private-download
      if: steps.cfg.outputs.run_mode != 'control' && (hashFiles('previous/rule-mining-dataset.json') == '')
      with:
        name: ensemble-market-validation-2026-10-07
        run-id: 37737276785
        github-token: ${{ github.token }}
        path: rule-bootstrap/2
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - uses: ./.github/actions/private-download
      if: steps.cfg.outputs.run_mode != 'control' && (hashFiles('previous/rule-mining-dataset.json') == '')
      with:
        name: ensemble-market-validation-2026-10-08
        run-id: 37892855843
        github-token: ${{ github.token }}
        path: rule-bootstrap/3
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - uses: ./.github/actions/private-download
      if: steps.cfg.outputs.run_mode != 'control' && (hashFiles('previous/rule-mining-dataset.json') == '')
      with:
        name: ensemble-market-validation-2026-10-09
        run-id: 38030605924
        github-token: ${{ github.token }}
        path: rule-bootstrap/4
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - name: Restore frozen history reference from previous artifact
      if: steps.cfg.outputs.run_mode != 'control'
      id: seed
      run: "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\nmkdir -p reference\nif test -f previous/reference-predictions.json;\
        \ then\n  cp previous/reference-predictions.json reference/predictions.json\n  cp previous/reference-manifest.json reference/manifest.json\n\
        \  echo \"available=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"available=false\" >> \"$GITHUB_OUTPUT\"\nfi\nPRIVATE_COMMAND\n"
    - uses: ./.github/actions/private-download
      if: steps.cfg.outputs.run_mode != 'control' && (steps.seed.outputs.available != 'true')
      with:
        name: balanced-history-comparison-2026-10-01
        run-id: 36802060423
        github-token: ${{ github.token }}
        path: reference
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install independent outcome learner dependency
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python -m pip install numpy==2.3.5

        PRIVATE_COMMAND

        '
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
        cache-dependency-path: 'football/pom.xml

          basketball/pom.xml

          '
    - name: Verify feature and validation rules
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python -m unittest discover -s experiments/ensemble_validation -v

        PRIVATE_COMMAND

        '
    - name: Restore verified preceding-day journals for checkpoint recovery
      if: steps.cfg.outputs.checkpoint_recovery == 'true'
      uses: ./.github/actions/private-download
      with:
        name: ensemble-market-validation-2026-10-29
        run-id: '40970606133'
        github-token: ${{ github.token }}
        path: recovery-parent
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - name: Preserve missing cumulative journals without overwriting checkpoint files
      if: steps.cfg.outputs.checkpoint_recovery == 'true'
      run: "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\npython3 - <<'PYJ'\nfrom pathlib import\
        \ Path\nimport shutil\nfor name in ['daily-journal.json','selection-journal.json','match-choice-journal.json','stability-journal.json']:\n\
        \    source=Path('recovery-parent')/name\n    destination=Path('previous')/name\n    if not source.is_file():raise ValueError('Missing\
        \ recovery parent journal')\n    if not destination.exists():shutil.copyfile(source,destination)\nPYJ\nPRIVATE_COMMAND\n"
    - name: Restore immutable artifact for experiment control
      if: steps.cfg.outputs.run_mode == 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/control_runtime.py begin --previous previous --output pipeline-output --target-date ''${{
        steps.cfg.outputs.target_date }}'' --source-run ''${{ steps.cfg.outputs.previous_run_id }}''

        PRIVATE_COMMAND

        '
    - name: Compile experiment HTTP refresh tools
      if: steps.cfg.outputs.run_mode == 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        mvn -B -f football/pom.xml compile

        mvn -B -f basketball/pom.xml compile

        PRIVATE_COMMAND

        '
    - name: Collect daily wide HTTP history (experiment only)
      if: steps.cfg.outputs.run_mode != 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/live_history.py --published published --previous previous --output pipeline-output --target-date
        ''${{ steps.cfg.outputs.target_date }}''

        PRIVATE_COMMAND

        '
    - name: Freeze paired inputs and feature ablations
      if: steps.cfg.outputs.run_mode != 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/prepare.py --published published --archive archive --reference reference --output pipeline-output
        --holdout ''${{ steps.cfg.outputs.target_date }}'' --live-history pipeline-output/live-history-journal.json

        PRIVATE_COMMAND

        '
    - name: Preserve reproducible history seed in artifact
      if: steps.cfg.outputs.run_mode != 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        cp reference/predictions.json pipeline-output/reference-predictions.json

        cp reference/manifest.json pipeline-output/reference-manifest.json

        PRIVATE_COMMAND

        '
    - name: Replay original football models
      if: steps.cfg.outputs.run_mode != 'control'
      working-directory: football
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        mvn -B compile exec:java -Dexec.mainClass=com.example.experiment.ExperimentReplay -Dexec.args="../pipeline-output/football-inputs.json
        ../pipeline-output/football-replay.json"

        PRIVATE_COMMAND

        '
    - name: Replay original basketball models
      if: steps.cfg.outputs.run_mode != 'control'
      working-directory: basketball
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        mvn -B compile exec:java -Dexec.mainClass=com.basketbol.experiment.ExperimentReplay -Dexec.args="../pipeline-output/basketball-inputs.json
        ../pipeline-output/basketball-replay.json"

        PRIVATE_COMMAND

        '
    - name: Add experimental goal and total history features
      if: steps.cfg.outputs.run_mode != 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/history_markets.py --output pipeline-output

        PRIVATE_COMMAND

        '
    - name: Run frozen primary model without research training
      if: steps.cfg.outputs.run_mode != 'control'
      env:
        OPENBLAS_NUM_THREADS: '1'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/primary_forecast.py --output pipeline-output --previous previous --target-date ''${{
        steps.cfg.outputs.target_date }}''

        PRIVATE_COMMAND

        '
    - name: Carry optional bootstrap for isolated research runner
      run: if [ -d rule-bootstrap ]; then cp -r rule-bootstrap pipeline-output/research-bootstrap; fi
    - name: Save encrypted primary forecasts before background work
      uses: ./.github/actions/private-upload
      with:
        name: primary-forecasts-${{ steps.cfg.outputs.target_date }}
        path: pipeline-output/
        retention-days: 30
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - name: Publish primary HTML immediately without waiting for research
      if: steps.cfg.outputs.run_mode != 'control'
      env:
        PRIVATE_REPORT_TOKEN: ${{ secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}
        REPORT_SOURCE_TOKEN: ${{ github.token }}
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/publish_primary.py --output pipeline-output --target-date ''${{ steps.cfg.outputs.target_date
        }}''

        PRIVATE_COMMAND

        '
    - name: Upload failed-run diagnostics
      if: failure()
      uses: ./.github/actions/private-upload
      with:
        name: ensemble-market-validation-diagnostics
        path: pipeline-output/
        retention-days: 7
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - name: Prepare private diagnostic directory
      if: always()
      run: mkdir -p "$RUNNER_TEMP/tahmin-private-logs"
    - name: Upload encrypted application diagnostics
      if: always()
      uses: ./.github/actions/private-upload
      with:
        name: private-logs-benchmark-${{ github.run_id }}
        path: ${{ runner.temp }}/tahmin-private-logs
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
        retention-days: '7'
  research:
    name: Background research and outcome reports
    needs: primary
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Use the promoted replay implementation on this runner
      run: "for sport in football basketball; do\n  rsync -a --delete \"promoted/replay/$sport/src/\" \"$sport/src/\"\n  cp \"promoted/replay/$sport/pom.xml\"\
        \ \"$sport/pom.xml\"\ndone\ncp promoted/artifact.py scripts/privacy/artifact.py\n"
    - name: Require private artifact key
      env:
        PRIVATE_ARTIFACT_KEY: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
      run: "python3 - <<'PYKEY'\nimport os, base64\ntry:\n k=base64.b64decode(os.environ.get(\"PRIVATE_ARTIFACT_KEY\", \"\"),validate=True)\n\
        \ assert len(k)==32\nexcept Exception:\n raise SystemExit(\"Configure PRIVATE_ARTIFACT_KEY before enabling this workflow\")\n\
        PYKEY\n"
    - uses: actions/checkout@v4
      if: needs.primary.outputs.run_mode != 'control'
      with:
        repository: sukrutureli/fathertahmin
        ref: ${{ needs.primary.outputs.published_ref }}
        path: published
        persist-credentials: false
        token: ${{ secrets.FATHERTAHMIN_READ_TOKEN || secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}
    - uses: actions/checkout@v4
      if: needs.primary.outputs.run_mode != 'control'
      with:
        repository: sukrutureli/fathertahmin
        ref: 700bc50bd7b63a616a8b9a61d4aa6de2f7e2a14c
        path: archive
        persist-credentials: false
        token: ${{ secrets.FATHERTAHMIN_READ_TOKEN || secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}
    - name: Restore exact primary checkpoint
      uses: ./.github/actions/private-download
      with:
        name: primary-forecasts-${{ needs.primary.outputs.target_date }}
        run-id: ${{ github.run_id }}
        github-token: ${{ github.token }}
        path: pipeline-output
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - name: Restore previous research journals
      uses: ./.github/actions/private-download
      with:
        name: ${{ needs.primary.outputs.previous_artifact }}
        run-id: ${{ needs.primary.outputs.previous_run_id }}
        github-token: ${{ github.token }}
        path: previous
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install independent outcome learner dependency
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python -m pip install numpy==2.3.5

        PRIVATE_COMMAND

        '
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
        cache-dependency-path: 'football/pom.xml

          basketball/pom.xml

          '
    - name: Compile result refresh tools in research runner
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        mvn -B -f football/pom.xml compile

        mvn -B -f basketball/pom.xml compile

        PRIVATE_COMMAND

        '
    - name: Verify feature and validation rules
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python -m unittest discover -s experiments/ensemble_validation -v

        PRIVATE_COMMAND

        '
    - name: Restore reference and optional bootstrap from primary checkpoint
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        mkdir -p reference

        if [ -f pipeline-output/reference-manifest.json ]; then cp pipeline-output/reference-manifest.json reference/manifest.json;
        fi

        if [ -f pipeline-output/reference-predictions.json ]; then cp pipeline-output/reference-predictions.json reference/predictions.json;
        fi

        if [ -d pipeline-output/research-bootstrap ]; then cp -r pipeline-output/research-bootstrap rule-bootstrap; fi

        PRIVATE_COMMAND

        '
    - name: Freeze conditional calibration shadow predictions
      if: needs.primary.outputs.run_mode != 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/conditional_rules.py freeze --output pipeline-output --previous previous

        PRIVATE_COMMAND

        '
    - name: Freeze earlier-day rule predictions before refreshing labels
      if: needs.primary.outputs.run_mode != 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/daybook.py freeze --output pipeline-output --previous previous

        PRIVATE_COMMAND

        '
    - name: Discover and freeze two-condition history rules (shadow only)
      if: needs.primary.outputs.run_mode != 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/mine_rules.py --input pipeline-output --output pipeline-output --previous previous --bootstrap
        rule-bootstrap --target-date ''${{ needs.primary.outputs.target_date }}''

        PRIVATE_COMMAND

        '
    - name: Learn outcomes and freeze independent model forecasts
      if: needs.primary.outputs.run_mode != 'control'
      env:
        OPENBLAS_NUM_THREADS: '1'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/outcome_learning.py --dataset pipeline-output/rule-mining-dataset.json --output pipeline-output
        --previous previous --target-date ''${{ needs.primary.outputs.target_date }}''

        PRIVATE_COMMAND

        '
    - name: Freeze independently validated football score distribution
      if: needs.primary.outputs.run_mode != 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/score_distribution.py freeze --output pipeline-output --previous previous

        PRIVATE_COMMAND

        '
    - name: Freeze top-half confidence selections before refreshing labels
      if: needs.primary.outputs.run_mode != 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/selection.py freeze --output pipeline-output --previous previous

        PRIVATE_COMMAND

        '
    - name: Freeze one market choice and score per match
      if: needs.primary.outputs.run_mode != 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/match_choice.py freeze --output pipeline-output --previous previous

        PRIVATE_COMMAND

        '
    - name: Prepare separate opponent and competition research candidates
      env:
        OPENBLAS_NUM_THREADS: '1'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/context_experiment.py prepare --output pipeline-output --previous previous --target-date
        ''${{ needs.primary.outputs.target_date }}''

        PRIVATE_COMMAND

        '
    - name: Lock opponent model and freeze stability cohort before results
      env:
        OPENBLAS_NUM_THREADS: '1'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/locked_stability.py freeze --output pipeline-output --previous previous --target-date
        ''${{ needs.primary.outputs.target_date }}''

        PRIVATE_COMMAND

        '
    - name: Freeze choices with available initial prices before results
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/priced_choices.py freeze --output pipeline-output

        PRIVATE_COMMAND

        '
    - name: Freeze separate score research candidates (daily only)
      if: needs.primary.outputs.run_mode != 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/score_research.py freeze --output pipeline-output --previous previous

        PRIVATE_COMMAND

        '
    - name: Freeze complete-market offered choices before results
      if: needs.primary.outputs.run_mode != 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/complete_prices.py freeze --output pipeline-output

        PRIVATE_COMMAND

        '
    - name: Freeze separate same-competition ten-percent candidate
      if: needs.primary.outputs.run_mode != 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/competition_blend.py freeze --output pipeline-output

        PRIVATE_COMMAND

        '
    - name: Save immutable forecasts before HTTP settlement
      if: needs.primary.outputs.run_mode != 'control'
      uses: ./.github/actions/private-upload
      with:
        name: frozen-forecasts-${{ needs.primary.outputs.target_date }}
        path: pipeline-output/
        retention-days: 30
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - name: Refresh today's finished football outcomes (artifact only)
      if: github.event_name != 'push'
      working-directory: football
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        mvn -B exec:java -Dexec.mainClass=com.example.experiment.OutcomeRefresh -Dexec.args="../pipeline-output/football-replay.json
        ../pipeline-output/football-outcome-audit.json ${{ needs.primary.outputs.refresh_flag }}"

        PRIVATE_COMMAND

        '
    - name: Refresh today's finished basketball outcomes (artifact only)
      if: github.event_name != 'push'
      working-directory: basketball
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        mvn -B exec:java -Dexec.mainClass=com.basketbol.experiment.OutcomeRefresh -Dexec.args="../pipeline-output/basketball-replay.json
        ../pipeline-output/basketball-outcome-audit.json ${{ needs.primary.outputs.refresh_flag }}"

        PRIVATE_COMMAND

        '
    - name: Validate baseline parity and train on earlier days only
