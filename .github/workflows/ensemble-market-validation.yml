name: Ensemble Market Validation (Artifacts Only)
run-name: Ensemble ${{ inputs.mode || 'auto' }} ${{ inputs.target_date || 'settings' }} [${{ inputs.production_run_id || 'manual' }}]
'on':
  push:
    branches:
    - experiment/ensemble-market-validation
    paths:
    - experiments/ensemble_validation/**
    - '**/experiment/*.java'
    - .github/workflows/ensemble-market-validation.yml
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily: predictions and training; control: frozen forecasts and HTTP results only'
        type: choice
        options:
        - daily
        - control
        default: daily
      target_date:
        description: Optional YYYY-MM-DD; defaults to experiment settings
        type: string
      source_run_id:
        description: Optional successful source run; control defaults to latest artifact for the date
        type: string
      published_ref:
        description: Verified private input commit SHA
        type: string
      production_run_id:
        description: Idempotent production run key
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: ensemble-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  benchmark:
    if: github.ref == 'refs/heads/experiment/ensemble-market-validation' && !contains(github.event.head_commit.message, '[privacy-migration]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Require private artifact key
      env:
        PRIVATE_ARTIFACT_KEY: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
      run: |
        python3 - <<'PYKEY'
        import os, base64
        try:
         k=base64.b64decode(os.environ.get("PRIVATE_ARTIFACT_KEY", ""),validate=True)
         assert len(k)==32
        except Exception:
         raise SystemExit("Configure PRIVATE_ARTIFACT_KEY before enabling this workflow")
        PYKEY
    - name: Resolve experimental day and frozen source
      id: cfg
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_TARGET_DATE: ${{ inputs.target_date }}
        INPUT_SOURCE_RUN: ${{ inputs.source_run_id }}
        INPUT_PUBLISHED_REF: ${{ inputs.published_ref }}
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/control_runtime.py config --settings experiments/ensemble_validation/experiment-settings.json
        PRIVATE_COMMAND
    - uses: actions/checkout@v4
      if: steps.cfg.outputs.run_mode != 'control'
      with:
        repository: sukrutureli/fathertahmin
        ref: ${{ steps.cfg.outputs.published_ref }}
        path: published
        persist-credentials: false
        token: ${{ secrets.FATHERTAHMIN_READ_TOKEN || secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}
    - uses: actions/checkout@v4
      if: steps.cfg.outputs.run_mode != 'control'
      with:
        repository: sukrutureli/fathertahmin
        ref: 700bc50bd7b63a616a8b9a61d4aa6de2f7e2a14c
        path: archive
        persist-credentials: false
        token: ${{ secrets.FATHERTAHMIN_READ_TOKEN || secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}
    - uses: ./.github/actions/private-download
      with:
        name: ${{ steps.cfg.outputs.previous_artifact }}
        run-id: ${{ steps.cfg.outputs.previous_run_id }}
        github-token: ${{ github.token }}
        path: previous
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - uses: ./.github/actions/private-download
      if: steps.cfg.outputs.run_mode != 'control' && (hashFiles('previous/rule-mining-dataset.json') == '')
      with:
        name: ensemble-market-validation-2026-10-03
        run-id: 37182748093
        github-token: ${{ github.token }}
        path: rule-bootstrap/0
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - uses: ./.github/actions/private-download
      if: steps.cfg.outputs.run_mode != 'control' && (hashFiles('previous/rule-mining-dataset.json') == '')
      with:
        name: ensemble-market-validation-2026-10-05
        run-id: 37422557787
        github-token: ${{ github.token }}
        path: rule-bootstrap/1
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - uses: ./.github/actions/private-download
      if: steps.cfg.outputs.run_mode != 'control' && (hashFiles('previous/rule-mining-dataset.json') == '')
      with:
        name: ensemble-market-validation-2026-10-07
        run-id: 37737276785
        github-token: ${{ github.token }}
        path: rule-bootstrap/2
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - uses: ./.github/actions/private-download
      if: steps.cfg.outputs.run_mode != 'control' && (hashFiles('previous/rule-mining-dataset.json') == '')
      with:
        name: ensemble-market-validation-2026-10-08
        run-id: 37892855843
        github-token: ${{ github.token }}
        path: rule-bootstrap/3
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - uses: ./.github/actions/private-download
      if: steps.cfg.outputs.run_mode != 'control' && (hashFiles('previous/rule-mining-dataset.json') == '')
      with:
        name: ensemble-market-validation-2026-10-09
        run-id: 38030605924
        github-token: ${{ github.token }}
        path: rule-bootstrap/4
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - name: Restore frozen history reference from previous artifact
      if: steps.cfg.outputs.run_mode != 'control'
      id: seed
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        mkdir -p reference
        if test -f previous/reference-predictions.json; then
          cp previous/reference-predictions.json reference/predictions.json
          cp previous/reference-manifest.json reference/manifest.json
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi
        PRIVATE_COMMAND
    - uses: ./.github/actions/private-download
      if: steps.cfg.outputs.run_mode != 'control' && (steps.seed.outputs.available != 'true')
      with:
        name: balanced-history-comparison-2026-10-01
        run-id: 36802060423
        github-token: ${{ github.token }}
        path: reference
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install independent outcome learner dependency
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python -m pip install numpy==2.3.5
        PRIVATE_COMMAND
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
        cache-dependency-path: |
          football/pom.xml
          basketball/pom.xml
    - name: Verify feature and validation rules
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python -m unittest discover -s experiments/ensemble_validation -v
        PRIVATE_COMMAND
    - name: Restore immutable artifact for experiment control
      if: steps.cfg.outputs.run_mode == 'control'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/control_runtime.py begin --previous previous --output pipeline-output --target-date '${{ steps.cfg.outputs.target_date }}' --source-run '${{ steps.cfg.outputs.previous_run_id }}'
        PRIVATE_COMMAND
    - name: Compile experiment HTTP refresh tools
      if: steps.cfg.outputs.run_mode == 'control'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        mvn -B -f football/pom.xml compile
        mvn -B -f basketball/pom.xml compile
        PRIVATE_COMMAND
    - name: Collect daily wide HTTP history (experiment only)
      if: steps.cfg.outputs.run_mode != 'control'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/live_history.py --published published --previous previous --output pipeline-output --target-date '${{ steps.cfg.outputs.target_date }}'
        PRIVATE_COMMAND
    - name: Freeze paired inputs and feature ablations
      if: steps.cfg.outputs.run_mode != 'control'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/prepare.py --published published --archive archive --reference reference --output pipeline-output --holdout '${{ steps.cfg.outputs.target_date }}' --live-history pipeline-output/live-history-journal.json
        PRIVATE_COMMAND
    - name: Preserve reproducible history seed in artifact
      if: steps.cfg.outputs.run_mode != 'control'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        cp reference/predictions.json pipeline-output/reference-predictions.json
        cp reference/manifest.json pipeline-output/reference-manifest.json
        PRIVATE_COMMAND
    - name: Replay original football models
      if: steps.cfg.outputs.run_mode != 'control'
      working-directory: football
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        mvn -B compile exec:java -Dexec.mainClass=com.example.experiment.ExperimentReplay -Dexec.args="../pipeline-output/football-inputs.json ../pipeline-output/football-replay.json"
        PRIVATE_COMMAND
    - name: Replay original basketball models
      if: steps.cfg.outputs.run_mode != 'control'
      working-directory: basketball
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        mvn -B compile exec:java -Dexec.mainClass=com.basketbol.experiment.ExperimentReplay -Dexec.args="../pipeline-output/basketball-inputs.json ../pipeline-output/basketball-replay.json"
        PRIVATE_COMMAND
    - name: Add experimental goal and total history features
      if: steps.cfg.outputs.run_mode != 'control'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/history_markets.py --output pipeline-output
        PRIVATE_COMMAND
    - name: Freeze conditional calibration shadow predictions
      if: steps.cfg.outputs.run_mode != 'control'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/conditional_rules.py freeze --output pipeline-output --previous previous
        PRIVATE_COMMAND
    - name: Freeze earlier-day rule predictions before refreshing labels
      if: steps.cfg.outputs.run_mode != 'control'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/daybook.py freeze --output pipeline-output --previous previous
        PRIVATE_COMMAND
    - name: Discover and freeze two-condition history rules (shadow only)
      if: steps.cfg.outputs.run_mode != 'control'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/mine_rules.py --input pipeline-output --output pipeline-output --previous previous --bootstrap rule-bootstrap --target-date '${{ steps.cfg.outputs.target_date }}'
        PRIVATE_COMMAND
    - name: Learn outcomes and freeze independent model forecasts
      if: steps.cfg.outputs.run_mode != 'control'
      env:
        OPENBLAS_NUM_THREADS: '1'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/outcome_learning.py --dataset pipeline-output/rule-mining-dataset.json --output pipeline-output --previous previous --target-date '${{ steps.cfg.outputs.target_date }}'
        PRIVATE_COMMAND
    - name: Freeze independently validated football score distribution
      if: steps.cfg.outputs.run_mode != 'control'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/score_distribution.py freeze --output pipeline-output --previous previous
        PRIVATE_COMMAND
    - name: Freeze top-half confidence selections before refreshing labels
      if: steps.cfg.outputs.run_mode != 'control'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/selection.py freeze --output pipeline-output --previous previous
        PRIVATE_COMMAND
    - name: Freeze one market choice and score per match
      if: steps.cfg.outputs.run_mode != 'control'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/match_choice.py freeze --output pipeline-output --previous previous
        PRIVATE_COMMAND
    - name: Prepare separate opponent and competition research candidates
      env:
        OPENBLAS_NUM_THREADS: '1'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/context_experiment.py prepare --output pipeline-output --previous previous --target-date '${{ steps.cfg.outputs.target_date }}'
        PRIVATE_COMMAND
    - name: Lock opponent model and freeze stability cohort before results
      env:
        OPENBLAS_NUM_THREADS: '1'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/locked_stability.py freeze --output pipeline-output --previous previous --target-date '${{ steps.cfg.outputs.target_date }}'
        PRIVATE_COMMAND
    - name: Freeze choices with available initial prices before results
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/priced_choices.py freeze --output pipeline-output
        PRIVATE_COMMAND
    - name: Refresh today's finished football outcomes (artifact only)
      working-directory: football
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        mvn -B exec:java -Dexec.mainClass=com.example.experiment.OutcomeRefresh -Dexec.args="../pipeline-output/football-replay.json ../pipeline-output/football-outcome-audit.json"
        PRIVATE_COMMAND
    - name: Refresh today's finished basketball outcomes (artifact only)
      working-directory: basketball
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        mvn -B exec:java -Dexec.mainClass=com.basketbol.experiment.OutcomeRefresh -Dexec.args="../pipeline-output/basketball-replay.json ../pipeline-output/basketball-outcome-audit.json"
        PRIVATE_COMMAND
    - name: Validate baseline parity and train on earlier days only
      if: steps.cfg.outputs.run_mode != 'control'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/report.py --output pipeline-output
        PRIVATE_COMMAND
    - name: Diagnose incorrect forecasts by historical features
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/error_diagnostics.py --output pipeline-output
        PRIVATE_COMMAND
    - name: Settle saved predictions and update daily journal
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/daybook.py settle --output pipeline-output --previous previous
        PRIVATE_COMMAND
    - name: Evaluate conditional calibration shadow predictions
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/conditional_rules.py settle --output pipeline-output --previous previous
        PRIVATE_COMMAND
    - name: Settle immutable subgroup rule forecasts
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/mine_rules.py --settle --input pipeline-output --output pipeline-output --target-date '${{ steps.cfg.outputs.target_date }}'
        PRIVATE_COMMAND
    - name: Settle independent learned forecasts
      env:
        OPENBLAS_NUM_THREADS: '1'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/outcome_learning.py --settle --dataset pipeline-output/rule-mining-dataset.json --output pipeline-output --target-date '${{ steps.cfg.outputs.target_date }}'
        PRIVATE_COMMAND
    - name: Evaluate selected cohorts without rewriting selections
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/selection.py settle --output pipeline-output --previous previous
        PRIVATE_COMMAND
    - name: Evaluate single-choice shortlist and render sortable HTML
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/match_choice.py settle --output pipeline-output --previous previous
        PRIVATE_COMMAND
    - name: Compare each system's own market and confidence subsets
      env:
        OPENBLAS_NUM_THREADS: '1'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/context_experiment.py settle --output pipeline-output --target-date '${{ steps.cfg.outputs.target_date }}'
        PRIVATE_COMMAND
    - name: Evaluate immutable modal football scores
      if: hashFiles('pipeline-output/score-before-results.json') != ''
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/score_distribution.py settle --output pipeline-output
        PRIVATE_COMMAND
    - name: Measure fixed opponent model over prospective days
      env:
        OPENBLAS_NUM_THREADS: '1'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/locked_stability.py settle --output pipeline-output --previous previous --target-date '${{ steps.cfg.outputs.target_date }}'
        PRIVATE_COMMAND
    - name: Verify provenance and history boundaries
      if: steps.cfg.outputs.run_mode != 'control'
      env:
        HOLDOUT_DATE: ${{ steps.cfg.outputs.target_date }}
        SOURCE_SHA: ${{ github.sha }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python - <<'PY'
        import json, os, subprocess
        from pathlib import Path
        root = Path("pipeline-output")
        for sport in ("football", "basketball"):
            rows = json.loads((root / (sport + "-replay.json")).read_text())
            assert len({(r["date"], r["eventId"]) for r in rows}) == len(rows)
            for row in rows:
                assert row["role"] == ("holdout" if row["date"] == os.environ["HOLDOUT_DATE"] else "training")
                for variant in row["variants"].values():
                    for side in ("home", "away"):
                        assert all(r["date"] < row["date"] for r in variant.get("audit", {}).get(side, {}).get("rows", []))
        manifest = json.loads((root / "input-manifest.json").read_text())
        manifest.update({"sourceSha": os.environ["SOURCE_SHA"], "runUrl": os.environ["RUN_URL"], "publishedSha": subprocess.check_output(["git", "-C", "published", "rev-parse", "HEAD"], text=True).strip(), "archiveSha": subprocess.check_output(["git", "-C", "archive", "rev-parse", "HEAD"], text=True).strip(), "referenceManifest": json.loads(Path("reference/manifest.json").read_text())})
        (root / "input-manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2))
        PY
        PRIVATE_COMMAND
    - name: Prove control preserved forecasts and model parameters
      if: steps.cfg.outputs.run_mode == 'control'
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/control_runtime.py verify --output pipeline-output
        PRIVATE_COMMAND
    - name: Render private artifact previews
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        google-chrome --headless=new --no-sandbox --disable-gpu --screenshot="$PWD/pipeline-output/desktop.png" --window-size=1440,1000 "file://$PWD/pipeline-output/models.html" >/tmp/render.log 2>&1
        google-chrome --headless=new --no-sandbox --disable-gpu --screenshot="$PWD/pipeline-output/mobile.png" --window-size=390,844 "file://$PWD/pipeline-output/index.html" >>/tmp/render.log 2>&1
        PRIVATE_COMMAND
    - name: Record production trigger without changing frozen forecast files
      env:
        PRODUCTION_KEY: ${{ inputs.production_run_id }}
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python3 - <<'PY'
        import json,os,re
        from pathlib import Path
        key=os.environ.get('PRODUCTION_KEY','')
        if key and not re.fullmatch(r'\d+(?:-previous)?',key):raise ValueError('Invalid production request key')
        Path('pipeline-output/production-trigger.json').write_text(json.dumps({'requestKey':key or None,'mode':'${{ steps.cfg.outputs.run_mode }}','targetDate':'${{ steps.cfg.outputs.target_date }}'}))
        PY
        PRIVATE_COMMAND
    - name: Show initial odds and MBS in prediction HTML
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/display_odds.py --output pipeline-output
        python experiments/ensemble_validation/new_reports.py --output pipeline-output
        PRIVATE_COMMAND
    - uses: ./.github/actions/private-upload
      with:
        name: ensemble-market-validation-${{ steps.cfg.outputs.target_date }}
        path: pipeline-output/
        retention-days: 30
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - name: Save bounded reports to private repository
      env:
        PRIVATE_REPORT_TOKEN: ${{ secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}
        REPORT_SOURCE_TOKEN: ${{ github.token }}
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python experiments/ensemble_validation/private_reports.py --root pipeline-output --source-run '${{ github.run_id }}' --target-date '${{ steps.cfg.outputs.target_date }}'
        PRIVATE_COMMAND
    - name: Upload failed-run diagnostics
      if: failure()
      uses: ./.github/actions/private-upload
      with:
        name: ensemble-market-validation-diagnostics
        path: pipeline-output/
        retention-days: 7
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - name: Prepare private diagnostic directory
      if: always()
      run: mkdir -p "$RUNNER_TEMP/tahmin-private-logs"
    - name: Upload encrypted application diagnostics
      if: always()
      uses: ./.github/actions/private-upload
      with:
        name: private-logs-benchmark-${{ github.run_id }}
        path: ${{ runner.temp }}/tahmin-private-logs
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
        retention-days: '7'
env:
  GITHUB_TOKEN: ${{ secrets.FATHERTAHMIN_READ_TOKEN || secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}

