      if: github.event_name != 'push'
      env:
        OPENBLAS_NUM_THREADS: '1'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/outcome_learning.py --settle --dataset pipeline-output/rule-mining-dataset.json --output
        pipeline-output --target-date ''${{ needs.primary.outputs.target_date }}''

        PRIVATE_COMMAND

        '
    - name: Evaluate selected cohorts without rewriting selections
      if: github.event_name != 'push'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/selection.py settle --output pipeline-output --previous previous

        PRIVATE_COMMAND

        '
    - name: Evaluate single-choice shortlist and render sortable HTML
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/match_choice.py settle --output pipeline-output --previous previous

        PRIVATE_COMMAND

        '
    - name: Compare each system's own market and confidence subsets
      if: github.event_name != 'push'
      env:
        OPENBLAS_NUM_THREADS: '1'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/context_experiment.py settle --output pipeline-output --target-date ''${{ needs.primary.outputs.target_date
        }}''

        PRIVATE_COMMAND

        '
    - name: Evaluate immutable modal football scores
      if: hashFiles('pipeline-output/score-before-results.json') != ''
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/score_distribution.py settle --output pipeline-output

        PRIVATE_COMMAND

        '
    - name: Measure fixed opponent model over prospective days
      env:
        OPENBLAS_NUM_THREADS: '1'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/locked_stability.py settle --output pipeline-output --previous previous --target-date
        ''${{ needs.primary.outputs.target_date }}''

        PRIVATE_COMMAND

        '
    - name: Verify provenance and history boundaries
      if: needs.primary.outputs.run_mode != 'control'
      env:
        HOLDOUT_DATE: ${{ needs.primary.outputs.target_date }}
        SOURCE_SHA: ${{ github.sha }}
        RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\npython - <<'PY'\nimport json, os, subprocess\n\
        from pathlib import Path\nroot = Path(\"pipeline-output\")\nfor sport in (\"football\", \"basketball\"):\n    rows = json.loads((root\
        \ / (sport + \"-replay.json\")).read_text())\n    assert len({(r[\"date\"], r[\"eventId\"]) for r in rows}) == len(rows)\n \
        \   for row in rows:\n        assert row[\"role\"] == (\"holdout\" if row[\"date\"] == os.environ[\"HOLDOUT_DATE\"] else \"\
        training\")\n        for variant in row[\"variants\"].values():\n            for side in (\"home\", \"away\"):\n           \
        \     assert all(r[\"date\"] < row[\"date\"] for r in variant.get(\"audit\", {}).get(side, {}).get(\"rows\", []))\nmanifest\
        \ = json.loads((root / \"input-manifest.json\").read_text())\nmanifest.update({\"sourceSha\": os.environ[\"SOURCE_SHA\"], \"\
        runUrl\": os.environ[\"RUN_URL\"], \"publishedSha\": subprocess.check_output([\"git\", \"-C\", \"published\", \"rev-parse\"\
        , \"HEAD\"], text=True).strip(), \"archiveSha\": subprocess.check_output([\"git\", \"-C\", \"archive\", \"rev-parse\", \"HEAD\"\
        ], text=True).strip(), \"referenceManifest\": json.loads(Path(\"reference/manifest.json\").read_text())})\n(root / \"input-manifest.json\"\
        ).write_text(json.dumps(manifest, ensure_ascii=False, indent=2))\nPY\nPRIVATE_COMMAND\n"
    - name: Evaluate separate frozen score research
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/score_research.py settle --output pipeline-output

        PRIVATE_COMMAND

        '
    - name: Measure frozen same-competition candidate without refitting
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/competition_blend.py settle --output pipeline-output

        PRIVATE_COMMAND

        '
    - name: Prove control preserved forecasts and model parameters
      if: needs.primary.outputs.run_mode == 'control'
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/control_runtime.py verify --output pipeline-output

        PRIVATE_COMMAND

        '
    - name: Render private artifact previews
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        google-chrome --headless=new --no-sandbox --disable-gpu --screenshot="$PWD/pipeline-output/desktop.png" --window-size=1440,1000
        "file://$PWD/pipeline-output/models.html" >/tmp/render.log 2>&1

        google-chrome --headless=new --no-sandbox --disable-gpu --screenshot="$PWD/pipeline-output/mobile.png" --window-size=390,844
        "file://$PWD/pipeline-output/index.html" >>/tmp/render.log 2>&1

        PRIVATE_COMMAND

        '
    - name: Record production trigger without changing frozen forecast files
      env:
        PRODUCTION_KEY: ${{ inputs.production_run_id }}
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python3 - <<''PY''

        import json,os,re

        from pathlib import Path

        key=os.environ.get(''PRODUCTION_KEY'','''')

        if key and not re.fullmatch(r''\d+(?:-previous)?'',key):raise ValueError(''Invalid production request key'')

        Path(''pipeline-output/production-trigger.json'').write_text(json.dumps({''requestKey'':key or None,''mode'':''${{ needs.primary.outputs.run_mode
        }}'',''targetDate'':''${{ needs.primary.outputs.target_date }}''}))

        PY

        PRIVATE_COMMAND

        '
    - name: Show initial odds and MBS in prediction HTML
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/display_odds.py --output pipeline-output

        python experiments/ensemble_validation/new_reports.py --output pipeline-output

        PRIVATE_COMMAND

        '
    - uses: ./.github/actions/private-upload
      with:
        name: ensemble-market-validation-${{ needs.primary.outputs.target_date }}
        path: pipeline-output/
        retention-days: 30
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - name: Save bounded reports to private repository
      env:
        PRIVATE_REPORT_TOKEN: ${{ secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}
        REPORT_SOURCE_TOKEN: ${{ github.token }}
      run: 'python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<''PRIVATE_COMMAND''

        python experiments/ensemble_validation/private_reports.py --root pipeline-output --source-run ''${{ github.run_id }}'' --target-date
        ''${{ needs.primary.outputs.target_date }}''

        PRIVATE_COMMAND

        '
    - name: Upload failed-run diagnostics
      if: failure()
      uses: ./.github/actions/private-upload
      with:
        name: ensemble-market-validation-diagnostics
        path: pipeline-output/
        retention-days: 7
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - name: Prepare private diagnostic directory
      if: always()
      run: mkdir -p "$RUNNER_TEMP/tahmin-private-logs"
    - name: Upload encrypted application diagnostics
      if: always()
      uses: ./.github/actions/private-upload
      with:
        name: private-logs-benchmark-${{ github.run_id }}
        path: ${{ runner.temp }}/tahmin-private-logs
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
        retention-days: '7'
env:
  GITHUB_TOKEN: ${{ secrets.FATHERTAHMIN_READ_TOKEN || secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}
