name: Ensemble Market Validation (Artifacts Only)
on:
  push:
    branches: ['experiment/ensemble-market-validation']
    paths: ['experiments/ensemble_validation/**', '**/experiment/*.java', '.github/workflows/ensemble-market-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ensemble-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    if: github.ref == 'refs/heads/experiment/ensemble-market-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve experimental day and frozen source
        id: cfg
        run: |
          python - <<'PY'
          import json, os, re
          from datetime import date
          c=json.load(open("experiments/ensemble_validation/experiment-settings.json"))
          date.fromisoformat(c["target_date"])
          assert re.fullmatch("[0-9a-f]{40}", c["published_ref"])
          assert str(c["previous_run_id"]).isdigit()
          assert re.fullmatch("ensemble-market-validation-[0-9-]+",c["previous_artifact"])
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              for k,v in c.items(): f.write(f"{k}={v}\n")
          PY
      - uses: actions/checkout@v4
        with:
          repository: sukrutureli/fathertahmin
          ref: ${{ steps.cfg.outputs.published_ref }}
          path: published
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sukrutureli/fathertahmin
          ref: '700bc50bd7b63a616a8b9a61d4aa6de2f7e2a14c'
          path: archive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.previous_artifact }}
          run-id: ${{ steps.cfg.outputs.previous_run_id }}
          github-token: ${{ github.token }}
          path: previous
      - uses: actions/download-artifact@v4
        if: hashFiles('previous/rule-mining-dataset.json') == ''
        with:
          name: ensemble-market-validation-2026-10-03
          run-id: 37182748093
          github-token: ${{ github.token }}
          path: rule-bootstrap/0
      - uses: actions/download-artifact@v4
        if: hashFiles('previous/rule-mining-dataset.json') == ''
        with:
          name: ensemble-market-validation-2026-10-05
          run-id: 37422557787
          github-token: ${{ github.token }}
          path: rule-bootstrap/1
      - uses: actions/download-artifact@v4
        if: hashFiles('previous/rule-mining-dataset.json') == ''
        with:
          name: ensemble-market-validation-2026-10-07
          run-id: 37737276785
          github-token: ${{ github.token }}
          path: rule-bootstrap/2
      - uses: actions/download-artifact@v4
        if: hashFiles('previous/rule-mining-dataset.json') == ''
        with:
          name: ensemble-market-validation-2026-10-08
          run-id: 37892855843
          github-token: ${{ github.token }}
          path: rule-bootstrap/3
      - uses: actions/download-artifact@v4
        if: hashFiles('previous/rule-mining-dataset.json') == ''
        with:
          name: ensemble-market-validation-2026-10-09
          run-id: 38030605924
          github-token: ${{ github.token }}
          path: rule-bootstrap/4
      - name: Restore frozen history reference from previous artifact
        id: seed
        run: |
          mkdir -p reference
          if test -f previous/reference-predictions.json; then
            cp previous/reference-predictions.json reference/predictions.json
            cp previous/reference-manifest.json reference/manifest.json
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.seed.outputs.available != 'true'
        with:
          name: balanced-history-comparison-2026-10-01
          run-id: 36802060423
          github-token: ${{ github.token }}
          path: reference
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent outcome learner dependency
        run: python -m pip install numpy==2.3.5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            football/pom.xml
            basketball/pom.xml
      - name: Verify feature and validation rules
        run: python -m unittest discover -s experiments/ensemble_validation -v
      - name: Collect daily wide HTTP history (experiment only)
        run: python experiments/ensemble_validation/live_history.py --published published --previous previous --output pipeline-output --target-date '${{ steps.cfg.outputs.target_date }}'
      - name: Freeze paired inputs and feature ablations
        run: python experiments/ensemble_validation/prepare.py --published published --archive archive --reference reference --output pipeline-output --holdout '${{ steps.cfg.outputs.target_date }}' --live-history pipeline-output/live-history-journal.json
      - name: Preserve reproducible history seed in artifact
        run: |
          cp reference/predictions.json pipeline-output/reference-predictions.json
          cp reference/manifest.json pipeline-output/reference-manifest.json
      - name: Replay original football models
        working-directory: football
        run: mvn -B compile exec:java -Dexec.mainClass=com.example.experiment.ExperimentReplay -Dexec.args="../pipeline-output/football-inputs.json ../pipeline-output/football-replay.json"
      - name: Replay original basketball models
        working-directory: basketball
        run: mvn -B compile exec:java -Dexec.mainClass=com.basketbol.experiment.ExperimentReplay -Dexec.args="../pipeline-output/basketball-inputs.json ../pipeline-output/basketball-replay.json"
      - name: Add experimental goal and total history features
        run: python experiments/ensemble_validation/history_markets.py --output pipeline-output
      - name: Freeze conditional calibration shadow predictions
        run: python experiments/ensemble_validation/conditional_rules.py freeze --output pipeline-output --previous previous
      - name: Freeze earlier-day rule predictions before refreshing labels
        run: python experiments/ensemble_validation/daybook.py freeze --output pipeline-output --previous previous
      - name: Discover and freeze two-condition history rules (shadow only)
        run: python experiments/ensemble_validation/mine_rules.py --input pipeline-output --output pipeline-output --previous previous --bootstrap rule-bootstrap --target-date '${{ steps.cfg.outputs.target_date }}'
      - name: Learn outcomes and freeze independent model forecasts
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python experiments/ensemble_validation/outcome_learning.py --dataset pipeline-output/rule-mining-dataset.json --output pipeline-output --previous previous --target-date '${{ steps.cfg.outputs.target_date }}'
      - name: Freeze independently validated football score distribution
        run: python experiments/ensemble_validation/score_distribution.py freeze --output pipeline-output --previous previous
      - name: Freeze top-half confidence selections before refreshing labels
        run: python experiments/ensemble_validation/selection.py freeze --output pipeline-output --previous previous
      - name: Freeze one market choice and score per match
        run: python experiments/ensemble_validation/match_choice.py freeze --output pipeline-output --previous previous
      - name: Refresh today's finished football outcomes (artifact only)
        working-directory: football
        run: mvn -B exec:java -Dexec.mainClass=com.example.experiment.OutcomeRefresh -Dexec.args="../pipeline-output/football-replay.json ../pipeline-output/football-outcome-audit.json"
      - name: Refresh today's finished basketball outcomes (artifact only)
        working-directory: basketball
        run: mvn -B exec:java -Dexec.mainClass=com.basketbol.experiment.OutcomeRefresh -Dexec.args="../pipeline-output/basketball-replay.json ../pipeline-output/basketball-outcome-audit.json"
      - name: Validate baseline parity and train on earlier days only
        run: python experiments/ensemble_validation/report.py --output pipeline-output
      - name: Diagnose incorrect forecasts by historical features
        run: python experiments/ensemble_validation/error_diagnostics.py --output pipeline-output
      - name: Settle saved predictions and update daily journal
        run: python experiments/ensemble_validation/daybook.py settle --output pipeline-output --previous previous
      - name: Evaluate conditional calibration shadow predictions
        run: python experiments/ensemble_validation/conditional_rules.py settle --output pipeline-output --previous previous
      - name: Settle immutable subgroup rule forecasts
        run: python experiments/ensemble_validation/mine_rules.py --settle --input pipeline-output --output pipeline-output --target-date '${{ steps.cfg.outputs.target_date }}'
      - name: Settle independent learned forecasts
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: python experiments/ensemble_validation/outcome_learning.py --settle --dataset pipeline-output/rule-mining-dataset.json --output pipeline-output --target-date '${{ steps.cfg.outputs.target_date }}'
      - name: Evaluate selected cohorts without rewriting selections
        run: python experiments/ensemble_validation/selection.py settle --output pipeline-output --previous previous
      - name: Evaluate single-choice shortlist and render sortable HTML
        run: python experiments/ensemble_validation/match_choice.py settle --output pipeline-output --previous previous
      - name: Evaluate immutable modal football scores
        run: python experiments/ensemble_validation/score_distribution.py settle --output pipeline-output
      - name: Verify provenance and history boundaries
        env:
          HOLDOUT_DATE: ${{ steps.cfg.outputs.target_date }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path("pipeline-output")
          for sport in ("football", "basketball"):
              rows = json.loads((root / (sport + "-replay.json")).read_text())
              assert len({(r["date"], r["eventId"]) for r in rows}) == len(rows)
              for row in rows:
                  assert row["role"] == ("holdout" if row["date"] == os.environ["HOLDOUT_DATE"] else "training")
                  for variant in row["variants"].values():
                      for side in ("home", "away"):
                          assert all(r["date"] < row["date"] for r in variant.get("audit", {}).get(side, {}).get("rows", []))
          manifest = json.loads((root / "input-manifest.json").read_text())
          manifest.update({"sourceSha": os.environ["SOURCE_SHA"], "runUrl": os.environ["RUN_URL"], "publishedSha": subprocess.check_output(["git", "-C", "published", "rev-parse", "HEAD"], text=True).strip(), "archiveSha": subprocess.check_output(["git", "-C", "archive", "rev-parse", "HEAD"], text=True).strip(), "referenceManifest": json.loads(Path("reference/manifest.json").read_text())})
          (root / "input-manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
      - name: Render private artifact previews
        run: |
          google-chrome --headless=new --no-sandbox --disable-gpu --screenshot="$PWD/pipeline-output/desktop.png" --window-size=1440,1000 "file://$PWD/pipeline-output/models.html" >/tmp/render.log 2>&1
          google-chrome --headless=new --no-sandbox --disable-gpu --screenshot="$PWD/pipeline-output/mobile.png" --window-size=390,844 "file://$PWD/pipeline-output/index.html" >>/tmp/render.log 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: ensemble-market-validation-${{ steps.cfg.outputs.target_date }}
          path: pipeline-output/
          if-no-files-found: error
          retention-days: 30
      - name: Upload failed-run diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ensemble-market-validation-diagnostics
          path: pipeline-output/
          if-no-files-found: ignore
          retention-days: 7
