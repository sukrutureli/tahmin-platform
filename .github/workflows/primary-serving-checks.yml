name: Primary serving checks
on:
  push:
    branches: [main]
    paths:
      - experiments/ensemble_validation/primary_forecast.py
      - experiments/ensemble_validation/publish_primary.py
      - experiments/ensemble_validation/test_primary_forecast.py
      - .github/workflows/ensemble-market-validation.yml
      - .github/workflows/primary-serving-checks.yml
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 PyYAML==6.0.3
      - run: python -m unittest discover -s experiments/ensemble_validation -v
      - run: python -m unittest discover -s tests -v
