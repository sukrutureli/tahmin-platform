          "run": "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\nmvn -B exec:java -Dexec.mainClass=com.example.experiment.OutcomeRefresh -Dexec.args=\"../pipeline-output/football-replay.json ../pipeline-output/football-outcome-audit.json --missing-only\"\nPRIVATE_COMMAND\n",
