            "github-token": "${{ github.token }}",
            "path": "pipeline-output",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}"
          }
        },
        {
          "uses": "./.github/actions/private-download",
          "with": {
            "name": "ensemble-market-validation-2026-11-10",
            "run-id": "42920219240",
            "github-token": "${{ github.token }}",
            "path": "previous",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Lock original forecasts and model",
          "run": "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\npython3 recovery-code/scripts/recover_frozen_reports.py lock --request recovery-code/.github/frozen-recovery-request.json --date 2026-11-12\nPRIVATE_COMMAND\n"
