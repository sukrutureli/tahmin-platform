name: Daily Prediction

on:
  workflow_dispatch:
  # schedule will be enabled after production cutover
  # schedule:
  #   - cron: '0 21 * * *'

permissions:
  contents: read

jobs:
  scrape:
    name: Scrape source data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m src.nesine_scraper.cli
      - uses: actions/upload-artifact@v4
        with:
          name: scraper-output
          path: scraper/output/
          if-no-files-found: error

  football:
    name: Football prediction
    needs: scrape
    runs-on: ubuntu-latest
    container:
      image: selenium/standalone-chrome:4.14.1-20231025
      options: --user root --shm-size=4gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: football/pom.xml
      - run: apt-get update && apt-get install -y maven
      - uses: actions/download-artifact@v4
        with:
          name: scraper-output
          path: scraper/output
      - name: Run football
        working-directory: football
        run: mvn clean compile exec:java -Dexec.args="futbol"
      - uses: actions/upload-artifact@v4
        with:
          name: football-public
          path: football/public/
          if-no-files-found: error

  basketball:
    name: Basketball prediction
    needs: scrape
    runs-on: ubuntu-latest
    container:
      image: selenium/standalone-chrome:4.14.1-20231025
      options: --user root --shm-size=4gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: basketball/pom.xml
      - run: apt-get update && apt-get install -y maven
      - uses: actions/download-artifact@v4
        with:
          name: scraper-output
          path: scraper/output
      - name: Run basketball
        working-directory: basketball
        run: mvn clean compile exec:java -Dexec.args="basketbol"
      - uses: actions/upload-artifact@v4
        with:
          name: basketball-public
          path: basketball/public/
          if-no-files-found: error

  publish:
    name: Publish football and basketball
    needs: [football, basketball]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: football-public
          path: publish/football-root
      - uses: actions/download-artifact@v4
        with:
          name: basketball-public
          path: publish/basketball-root
      - name: Publish atomically to fathertahmin
        env:
          TOKEN: ${{ secrets.ADMIN_USER }}
        run: |
          test -n "$TOKEN" || { echo "ADMIN_USER secret is missing."; exit 1; }
          git clone "https://x-access-token:${TOKEN}@github.com/sukrutureli/fathertahmin.git" target-repo

          # Each project's public directory already contains its sport folder.
          # Copy to repository root exactly like the old workflows did.
          cp -r publish/football-root/* target-repo/
          cp -r publish/basketball-root/* target-repo/

          cd target-repo
          git config user.name "Şükrü Türeli"
          git config user.email "sukrutureli@gmail.com"
          git add futbol basketbol
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "📦 [TAHMIN-PLATFORM] Daily update ($(date +'%Y-%m-%d %H:%M'))"
          git push origin main
