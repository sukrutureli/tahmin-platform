name: Daily Prediction

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m src.nesine_scraper.cli
      - uses: actions/upload-artifact@v4
        with:
          name: scraper-output
          path: scraper/output/
          if-no-files-found: error

  football:
    needs: scrape
    runs-on: ubuntu-latest
    container:
      image: selenium/standalone-chrome:4.14.1-20231025
      options: --user root --shm-size=4gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: football/pom.xml
      - run: apt-get update && apt-get install -y maven python3
      - uses: actions/download-artifact@v4
        with:
          name: scraper-output
          path: scraper/output
      - name: Serve same-run scraper output
        run: |
          test -f scraper/output/latest.json || { echo "scraper/output/latest.json is missing"; exit 1; }
          python3 -m http.server 8765 --bind 127.0.0.1 --directory scraper/output >/tmp/scraper-http.log 2>&1 &
          echo $! > /tmp/scraper-http.pid
          sleep 1
          curl --fail --silent http://127.0.0.1:8765/latest.json >/dev/null
          sed -i 's#https://sukrutureli.github.io/Scraper/output/latest.json#http://127.0.0.1:8765/latest.json#' football/src/main/java/com/example/scraper/MatchScraper.java
          grep -q 'http://127.0.0.1:8765/latest.json' football/src/main/java/com/example/scraper/MatchScraper.java
          echo "Football Daily source: same-run scraper/output/latest.json"
      - working-directory: football
        run: mvn clean compile exec:java -Dexec.args="futbol"
      - uses: actions/upload-artifact@v4
        with:
          name: football-public
          path: football/public/
          if-no-files-found: error

  basketball:
    needs: scrape
    runs-on: ubuntu-latest
    container:
      image: selenium/standalone-chrome:4.14.1-20231025
      options: --user root --shm-size=4gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: basketball/pom.xml
      - run: apt-get update && apt-get install -y maven python3
      - uses: actions/download-artifact@v4
        with:
          name: scraper-output
          path: scraper/output
      - name: Serve same-run scraper output
        run: |
          test -f scraper/output/latestBasketbol.json || { echo "scraper/output/latestBasketbol.json is missing"; exit 1; }
          python3 -m http.server 8765 --bind 127.0.0.1 --directory scraper/output >/tmp/scraper-http.log 2>&1 &
          echo $! > /tmp/scraper-http.pid
          sleep 1
          curl --fail --silent http://127.0.0.1:8765/latestBasketbol.json >/dev/null
          sed -i 's#https://sukrutureli.github.io/Scraper/output/latestBasketbol.json#http://127.0.0.1:8765/latestBasketbol.json#' basketball/src/main/java/com/basketbol/scraper/BasketballScraper.java
          grep -q 'http://127.0.0.1:8765/latestBasketbol.json' basketball/src/main/java/com/basketbol/scraper/BasketballScraper.java
          echo "Basketball Daily source: same-run scraper/output/latestBasketbol.json"
      - working-directory: basketball
        run: mvn clean compile exec:java -Dexec.args="basketbol"
      - uses: actions/upload-artifact@v4
        with:
          name: basketball-public
          path: basketball/public/
          if-no-files-found: error

  publish:
    needs: [football, basketball]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: football-public
          path: publish/football-root
      - uses: actions/download-artifact@v4
        with:
          name: basketball-public
          path: publish/basketball-root
      - env:
          TOKEN: ${{ secrets.ADMIN_USER }}
        run: |
          test -n "$TOKEN" || { echo "ADMIN_USER secret is missing."; exit 1; }
          git clone "https://x-access-token:${TOKEN}@github.com/sukrutureli/fathertahmin.git" target-repo
          rm -rf target-repo/futbol/futbol target-repo/basketbol/basketbol
          cp -r publish/football-root/* target-repo/
          cp -r publish/basketball-root/* target-repo/
          cd target-repo
          git config user.name "Şükrü Türeli"
          git config user.email "sukrutureli@gmail.com"
          git add -A futbol basketbol
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "📦 [TAHMIN-PLATFORM] Daily update ($(date +'%Y-%m-%d %H:%M'))"
          git push origin main
