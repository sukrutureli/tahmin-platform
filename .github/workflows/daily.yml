name: Daily Prediction

on:
  workflow_dispatch:
  push:
    branches:
      - diagnose/nesine-history-network

permissions:
  contents: read

jobs:
  network-diagnostic:
    name: Inspect one public Nesine match
    runs-on: ubuntu-latest
    container:
      image: selenium/standalone-chrome:4.14.1-20231025
      options: --user root --shm-size=4gb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: football/pom.xml
      - run: apt-get update && apt-get install -y maven
      - name: Record XHR and Fetch endpoint shapes
        working-directory: football
        run: mvn -q clean compile exec:java
      - name: Save public API examples for field mapping
        run: |
          mkdir -p api-samples
          for id in 3166383 3226161; do
            curl -fsS --connect-timeout 10 --max-time 20 "https://apistats.nesine.com/api/v3/HeadToHead/$id/Header" -o "api-samples/$id-header.json"
            curl -fsS --connect-timeout 10 --max-time 20 "https://apistats.nesine.com/api/v3/HeadToHead/$id/Summary?competitionHistoryCount=10" -o "api-samples/$id-summary.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: public-api-examples
          path: api-samples/*.json
          retention-days: 1
