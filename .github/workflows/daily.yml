name: Daily Prediction
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  scrape:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Require private artifact key
      env:
        PRIVATE_ARTIFACT_KEY: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
      run: |
        python3 - <<'PYKEY'
        import os, base64
        try:
         k=base64.b64decode(os.environ.get("PRIVATE_ARTIFACT_KEY", ""),validate=True)
         assert len(k)==32
        except Exception:
         raise SystemExit("Configure PRIVATE_ARTIFACT_KEY before enabling this workflow")
        PYKEY
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: scraper/requirements.txt
    - run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        pip install -r requirements.txt
        PRIVATE_COMMAND
    - run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        python -m src.nesine_scraper.cli
        PRIVATE_COMMAND
    - uses: ./.github/actions/private-upload
      with:
        name: scraper-output
        path: scraper/output/
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - name: Prepare private diagnostic directory
      if: always()
      run: mkdir -p "$RUNNER_TEMP/tahmin-private-logs"
    - name: Upload encrypted application diagnostics
      if: always()
      uses: ./.github/actions/private-upload
      with:
        name: private-logs-scrape-${{ github.run_id }}
        path: ${{ runner.temp }}/tahmin-private-logs
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
        retention-days: '7'
  football:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Require private artifact key
      env:
        PRIVATE_ARTIFACT_KEY: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
      run: |
        python3 - <<'PYKEY'
        import os, base64
        try:
         k=base64.b64decode(os.environ.get("PRIVATE_ARTIFACT_KEY", ""),validate=True)
         assert len(k)==32
        except Exception:
         raise SystemExit("Configure PRIVATE_ARTIFACT_KEY before enabling this workflow")
        PYKEY
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
        cache-dependency-path: football/pom.xml
    - uses: ./.github/actions/private-download
      with:
        name: scraper-output
        path: scraper/output
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
        github-token: ${{ github.token }}
    - name: Serve same-run scraper output
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        test -f scraper/output/latest.json || { echo "scraper/output/latest.json is missing"; exit 1; }
        python3 -m http.server 8765 --bind 127.0.0.1 --directory scraper/output >/tmp/scraper-http.log 2>&1 &
        echo $! > /tmp/scraper-http.pid
        sleep 1
        curl --fail --silent http://127.0.0.1:8765/latest.json >/dev/null
        sed -i 's#https://sukrutureli.github.io/Scraper/output/latest.json#http://127.0.0.1:8765/latest.json#' football/src/main/java/com/example/scraper/MatchScraper.java
        grep -q 'http://127.0.0.1:8765/latest.json' football/src/main/java/com/example/scraper/MatchScraper.java
        echo "Football Daily source: same-run scraper/output/latest.json"
        PRIVATE_COMMAND
    - working-directory: football
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        mvn clean compile exec:java -Dexec.args="futbol"
        PRIVATE_COMMAND
    - uses: ./.github/actions/private-upload
      with:
        name: football-public
        path: football/public/
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - name: Prepare private diagnostic directory
      if: always()
      run: mkdir -p "$RUNNER_TEMP/tahmin-private-logs"
    - name: Upload encrypted application diagnostics
      if: always()
      uses: ./.github/actions/private-upload
      with:
        name: private-logs-football-${{ github.run_id }}
        path: ${{ runner.temp }}/tahmin-private-logs
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
        retention-days: '7'
  basketball:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Require private artifact key
      env:
        PRIVATE_ARTIFACT_KEY: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
      run: |
        python3 - <<'PYKEY'
        import os, base64
        try:
         k=base64.b64decode(os.environ.get("PRIVATE_ARTIFACT_KEY", ""),validate=True)
         assert len(k)==32
        except Exception:
         raise SystemExit("Configure PRIVATE_ARTIFACT_KEY before enabling this workflow")
        PYKEY
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven
        cache-dependency-path: basketball/pom.xml
    - uses: ./.github/actions/private-download
      with:
        name: scraper-output
        path: scraper/output
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
        github-token: ${{ github.token }}
    - name: Serve same-run scraper output
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        set -- scraper/output/basketbol-????-??-??.json
        test "$#" -eq 1 && test -f "$1" || { echo "Expected one dated basketball JSON from this run"; exit 1; }
        source_file="$1"
        json_file="${source_file##*/}"
        BASKETBALL_FILE="$source_file" python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        path = Path(os.environ["BASKETBALL_FILE"])
        date = path.stem[len("basketbol-"):]
        rows = json.loads(path.read_text(encoding="utf-8"))
        if not isinstance(rows, list) or not rows or any(row.get("date") != date for row in rows):
            raise SystemExit(f"Basketball JSON is empty or contains dates other than {date}: {path}")
        print(f"Validated {len(rows)} basketball matches for {date}")
        PY
        python3 -m http.server 8765 --bind 127.0.0.1 --directory scraper/output >/tmp/scraper-http.log 2>&1 &
        echo $! > /tmp/scraper-http.pid
        sleep 1
        curl --fail --silent "http://127.0.0.1:8765/$json_file" >/dev/null
        sed -i "s#https://sukrutureli.github.io/Scraper/output/latestBasketbol.json#http://127.0.0.1:8765/$json_file#" basketball/src/main/java/com/basketbol/scraper/BasketballScraper.java
        grep -Fq "http://127.0.0.1:8765/$json_file" basketball/src/main/java/com/basketbol/scraper/BasketballScraper.java
        echo "Basketball Daily source: same-run $source_file"
        PRIVATE_COMMAND
    - working-directory: basketball
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        mvn clean compile exec:java -Dexec.args="basketbol"
        PRIVATE_COMMAND
    - uses: ./.github/actions/private-upload
      with:
        name: basketball-public
        path: basketball/public/
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
    - name: Prepare private diagnostic directory
      if: always()
      run: mkdir -p "$RUNNER_TEMP/tahmin-private-logs"
    - name: Upload encrypted application diagnostics
      if: always()
      uses: ./.github/actions/private-upload
      with:
        name: private-logs-basketball-${{ github.run_id }}
        path: ${{ runner.temp }}/tahmin-private-logs
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
        retention-days: '7'
  publish:
    needs:
    - football
    - basketball
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Require private artifact key
      env:
        PRIVATE_ARTIFACT_KEY: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
      run: |
        python3 - <<'PYKEY'
        import os, base64
        try:
         k=base64.b64decode(os.environ.get("PRIVATE_ARTIFACT_KEY", ""),validate=True)
         assert len(k)==32
        except Exception:
         raise SystemExit("Configure PRIVATE_ARTIFACT_KEY before enabling this workflow")
        PYKEY
    - uses: ./.github/actions/private-download
      with:
        name: football-public
        path: publish/football-root
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
        github-token: ${{ github.token }}
    - uses: ./.github/actions/private-download
      with:
        name: basketball-public
        path: publish/basketball-root
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
        github-token: ${{ github.token }}
    - env:
        TOKEN: ${{ secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}
      run: |
        python3 "$GITHUB_WORKSPACE/scripts/privacy/run_private.py" <<'PRIVATE_COMMAND'
        test -n "$TOKEN" || { echo "ADMIN_USER secret is missing."; exit 1; }
        git clone "https://x-access-token:${TOKEN}@github.com/sukrutureli/fathertahmin.git" target-repo
        rm -rf target-repo/futbol/futbol target-repo/basketbol/basketbol
        cp -r publish/football-root/* target-repo/
        cp -r publish/basketball-root/* target-repo/
        cd target-repo
        git config user.name "Şükrü Türeli"
        git config user.email "sukrutureli@gmail.com"
        git add -A futbol basketbol
        if git diff --cached --quiet; then exit 0; fi
        git commit -m "📦 [TAHMIN-PLATFORM] Daily update ($(date +'%Y-%m-%d %H:%M'))"
        git push origin main
        PRIVATE_COMMAND
    - name: Prepare private diagnostic directory
      if: always()
      run: mkdir -p "$RUNNER_TEMP/tahmin-private-logs"
    - name: Upload encrypted application diagnostics
      if: always()
      uses: ./.github/actions/private-upload
      with:
        name: private-logs-publish-${{ github.run_id }}
        path: ${{ runner.temp }}/tahmin-private-logs
        key: ${{ secrets.PRIVATE_ARTIFACT_KEY }}
        retention-days: '7'
env:
  GITHUB_TOKEN: ${{ secrets.FATHERTAHMIN_READ_TOKEN || secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}
