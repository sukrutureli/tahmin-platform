{
  "name": "Recover 2026-11-13 primary checkpoint",
  "run-name": "Recover primary 2026-11-13 in bounded encrypted stages",
  "on": {
    "push": {
      "branches": [
        "experiment/ensemble-market-validation"
      ],
      "paths": [
        ".github/primary-split-request.json"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "primary-split-2026-11-13",
    "cancel-in-progress": false
  },
  "jobs": {
    "history": {
      "name": "Collect frozen daily history",
      "if": "github.ref == 'refs/heads/experiment/ensemble-market-validation'",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 35,
      "env": {
        "OPENBLAS_NUM_THREADS": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "da8904d0fafa3bb59a53a31c887d292729911c66",
            "persist-credentials": false
          }
        },
        {
          "name": "Use promoted privacy implementation",
          "run": "cp promoted/artifact.py scripts/privacy/artifact.py"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "sukrutureli/fathertahmin",
            "ref": "c1c6e706a68acedfed6d8a40014ce13cb0e6e6d9",
            "path": "published",
            "persist-credentials": false,
            "token": "${{ secrets.FATHERTAHMIN_READ_TOKEN || secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}"
          }
        },
        {
          "uses": "./.github/actions/private-download",
          "with": {
            "name": "ensemble-market-validation-2026-11-10",
            "run-id": "42920219240",
            "github-token": "${{ github.token }}",
            "path": "previous",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}"
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Collect same frozen wide history",
          "run": "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\npython experiments/ensemble_validation/live_history.py --published published --previous previous --output pipeline-output --target-date '2026-11-13'\nPRIVATE_COMMAND"
        },
        {
          "name": "Stage only encrypted history",
          "run": "mkdir -p history-state && mv pipeline-output history-state/"
        },
        {
          "uses": "./.github/actions/private-upload",
          "with": {
            "name": "primary-history-2026-11-13",
            "path": "history-state",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}",
            "retention-days": "7"
          }
        },
        {
          "name": "Keep logs encrypted",
          "if": "always()",
          "run": "mkdir -p \"$RUNNER_TEMP/tahmin-private-logs\""
        },
        {
          "uses": "./.github/actions/private-upload",
          "if": "always()",
          "with": {
            "name": "private-split-history-logs-2026-11-13",
            "path": "${{ runner.temp }}/tahmin-private-logs",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}",
            "retention-days": "7"
          }
        }
      ]
    },
    "prepare": {
      "name": "Freeze inputs and replay source models",
      "needs": "history",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "env": {
        "OPENBLAS_NUM_THREADS": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "da8904d0fafa3bb59a53a31c887d292729911c66",
            "persist-credentials": false
          }
        },
        {
          "name": "Use promoted replay and privacy implementations",
          "run": "for sport in football basketball; do rsync -a --delete \"promoted/replay/$sport/src/\" \"$sport/src/\"; cp \"promoted/replay/$sport/pom.xml\" \"$sport/pom.xml\"; done\ncp promoted/artifact.py scripts/privacy/artifact.py"
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "sukrutureli/fathertahmin",
            "ref": "c1c6e706a68acedfed6d8a40014ce13cb0e6e6d9",
            "path": "published",
            "persist-credentials": false,
            "token": "${{ secrets.FATHERTAHMIN_READ_TOKEN || secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}"
          }
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "repository": "sukrutureli/fathertahmin",
            "ref": "700bc50bd7b63a616a8b9a61d4aa6de2f7e2a14c",
            "path": "archive",
            "persist-credentials": false,
            "token": "${{ secrets.FATHERTAHMIN_READ_TOKEN || secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}"
          }
        },
        {
          "uses": "./.github/actions/private-download",
          "with": {
            "name": "ensemble-market-validation-2026-11-10",
            "run-id": "42920219240",
            "github-token": "${{ github.token }}",
            "path": "previous",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}"
          }
        },
        {
          "uses": "./.github/actions/private-download",
          "with": {
            "name": "primary-history-2026-11-13",
            "run-id": "${{ github.run_id }}",
            "github-token": "${{ github.token }}",
            "path": "history-state",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}"
          }
        },
        {
          "name": "Restore encrypted history state",
          "run": "mv history-state/pipeline-output pipeline-output\nmkdir -p reference\ncp previous/reference-predictions.json reference/predictions.json\ncp previous/reference-manifest.json reference/manifest.json"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install fixed dependency",
          "run": "python3 -m pip install numpy==2.3.5"
        },
        {
          "uses": "actions/setup-java@v4",
          "with": {
            "distribution": "temurin",
            "java-version": "17",
            "cache": "maven",
            "cache-dependency-path": "football/pom.xml\nbasketball/pom.xml"
          }
        },
        {
          "name": "Verify frozen rules",
          "run": "python -m unittest discover -s experiments/ensemble_validation -v"
        },
        {
          "name": "Freeze exact daily inputs",
          "run": "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\npython experiments/ensemble_validation/prepare.py --published published --archive archive --reference reference --output pipeline-output --holdout '2026-11-13' --live-history pipeline-output/live-history-journal.json\ncp reference/predictions.json pipeline-output/reference-predictions.json\ncp reference/manifest.json pipeline-output/reference-manifest.json\nPRIVATE_COMMAND"
        },
        {
          "name": "Replay original football models",
          "run": "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\nmvn -B compile exec:java -Dexec.mainClass=com.example.experiment.ExperimentReplay -Dexec.args=\"../pipeline-output/football-inputs.json ../pipeline-output/football-replay.json\"\nPRIVATE_COMMAND",
          "working-directory": "football"
        },
        {
          "name": "Replay original basketball models",
          "run": "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\nmvn -B compile exec:java -Dexec.mainClass=com.basketbol.experiment.ExperimentReplay -Dexec.args=\"../pipeline-output/basketball-inputs.json ../pipeline-output/basketball-replay.json\"\nPRIVATE_COMMAND",
          "working-directory": "basketball"
        },
        {
          "name": "Add existing history market features",
          "run": "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\npython experiments/ensemble_validation/history_markets.py --output pipeline-output\nPRIVATE_COMMAND"
        },
        {
          "name": "Stage prepared state",
          "run": "mkdir -p prepared-state && mv pipeline-output prepared-state/"
        },
        {
          "uses": "./.github/actions/private-upload",
          "with": {
            "name": "primary-prepared-2026-11-13",
            "path": "prepared-state",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}",
            "retention-days": "7"
          }
        }
      ]
    },
    "forecast": {
      "name": "Freeze primary forecasts and publish HTML",
      "needs": "prepare",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "env": {
        "OPENBLAS_NUM_THREADS": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "da8904d0fafa3bb59a53a31c887d292729911c66",
            "persist-credentials": false
          }
        },
        {
          "name": "Use promoted privacy implementation",
          "run": "cp promoted/artifact.py scripts/privacy/artifact.py"
        },
        {
          "uses": "./.github/actions/private-download",
          "with": {
            "name": "ensemble-market-validation-2026-11-10",
            "run-id": "42920219240",
            "github-token": "${{ github.token }}",
            "path": "previous",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}"
          }
        },
        {
          "uses": "./.github/actions/private-download",
          "with": {
            "name": "primary-prepared-2026-11-13",
            "run-id": "${{ github.run_id }}",
            "github-token": "${{ github.token }}",
            "path": "prepared-state",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}"
          }
        },
        {
          "name": "Restore prepared state",
          "run": "mv prepared-state/pipeline-output pipeline-output"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install fixed dependency",
          "run": "python3 -m pip install numpy==2.3.5"
        },
        {
          "name": "Run unchanged frozen primary model",
          "run": "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\npython experiments/ensemble_validation/primary_forecast.py --output pipeline-output --previous previous --target-date '2026-11-13'\nPRIVATE_COMMAND"
        },
        {
          "uses": "./.github/actions/private-upload",
          "with": {
            "name": "primary-forecasts-2026-11-13",
            "path": "pipeline-output",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}",
            "retention-days": "30"
          }
        },
        {
          "name": "Publish private primary HTML",
          "env": {
            "PRIVATE_REPORT_TOKEN": "${{ secrets.FATHERTAHMIN_WRITE_TOKEN || secrets.ADMIN_USER }}",
            "REPORT_SOURCE_TOKEN": "${{ github.token }}"
          },
          "run": "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\npython experiments/ensemble_validation/publish_primary.py --output pipeline-output --target-date '2026-11-13'\nPRIVATE_COMMAND"
        },
        {
          "name": "Keep logs encrypted",
          "if": "always()",
          "run": "mkdir -p \"$RUNNER_TEMP/tahmin-private-logs\""
        },
        {
          "uses": "./.github/actions/private-upload",
          "if": "always()",
          "with": {
            "name": "private-split-forecast-logs-2026-11-13",
            "path": "${{ runner.temp }}/tahmin-private-logs",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}",
            "retention-days": "7"
          }
        }
      ]
    }
  }
}
