{
  "name": "Recover 2026-11-13 primary checkpoint",
  "run-name": "Recover Nov 13 primary serving without cumulative research serialization",
  "on": {
    "push": {
      "branches": [
        "experiment/ensemble-market-validation"
      ],
      "paths": [
        ".github/primary-split-request.json"
      ]
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "primary-split-2026-11-13",
    "cancel-in-progress": true
  },
  "jobs": {
    "forecast": {
      "name": "Freeze primary forecasts and publish HTML",
      "needs": "enrich",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "env": {
        "OPENBLAS_NUM_THREADS": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "da8904d0fafa3bb59a53a31c887d292729911c66",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ github.sha }}",
            "path": "recovery-code",
            "persist-credentials": false
          }
        },
        {
          "name": "Use promoted privacy implementation",
          "run": "cp promoted/artifact.py scripts/privacy/artifact.py"
        },
        {
          "uses": "./.github/actions/private-download",
          "with": {
            "name": "ensemble-market-validation-2026-11-10",
            "run-id": "42920219240",
            "github-token": "${{ github.token }}",
            "path": "previous",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}"
          }
        },
        {
          "uses": "./.github/actions/private-download",
          "with": {
            "name": "primary-enriched-2026-11-13",
            "run-id": "${{ github.run_id }}",
            "github-token": "${{ github.token }}",
            "path": "enriched-state",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}"
          }
        },
        {
          "name": "Restore enriched state",
          "run": "mv enriched-state/pipeline-output pipeline-output"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install fixed dependency",
          "run": "python3 -m pip install numpy==2.3.5"
        },
        {
          "name": "Run unchanged frozen inference from preserved enrichment",
          "run": "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\npython recovery-code/scripts/primary_serving_recovery.py freeze --output pipeline-output --previous previous --target-date '2026-11-13'\nPRIVATE_COMMAND",
          "env": {
            "PYTHONPATH": "${{ github.workspace }}/recovery-code/scripts:${{ github.workspace }}/experiments/ensemble_validation"
          }
        },
        {
          "uses": "./.github/actions/private-upload",
          "with": {
            "name": "primary-forecasts-2026-11-13",
            "path": "pipeline-output",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}",
            "retention-days": "30"
          }
        },
        {
          "name": "Keep logs encrypted",
          "if": "always()",
          "run": "mkdir -p \"$RUNNER_TEMP/tahmin-private-logs\""
        },
        {
          "uses": "./.github/actions/private-upload",
          "if": "always()",
          "with": {
            "name": "private-split-forecast-logs-2026-11-13",
            "path": "${{ runner.temp }}/tahmin-private-logs",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}",
            "retention-days": "7"
          }
        }
      ]
    },
    "enrich": {
      "name": "Bounded context enrichment",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "env": {
        "OPENBLAS_NUM_THREADS": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "da8904d0fafa3bb59a53a31c887d292729911c66",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ github.sha }}",
            "path": "recovery-code",
            "persist-credentials": false
          }
        },
        {
          "name": "Use promoted privacy implementation",
          "run": "cp promoted/artifact.py scripts/privacy/artifact.py"
        },
        {
          "uses": "./.github/actions/private-download",
          "with": {
            "name": "ensemble-market-validation-2026-11-10",
            "run-id": "42920219240",
            "github-token": "${{ github.token }}",
            "path": "previous",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}"
          }
        },
        {
          "uses": "./.github/actions/private-download",
          "with": {
            "name": "primary-ledger-2026-11-13",
            "run-id": "${{ github.run_id }}",
            "github-token": "${{ github.token }}",
            "path": "ledger-state",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}"
          }
        },
        {
          "name": "Restore ledger state",
          "run": "mv ledger-state/pipeline-output pipeline-output"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install fixed dependency",
          "run": "python3 -m pip install numpy==2.3.5"
        },
        {
          "name": "Run the unchanged bounded enrichment",
          "run": "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\npython recovery-code/scripts/primary_serving_recovery.py enrich --output pipeline-output --previous previous --target-date '2026-11-13'\nPRIVATE_COMMAND",
          "env": {
            "PYTHONPATH": "${{ github.workspace }}/recovery-code/scripts:${{ github.workspace }}/experiments/ensemble_validation"
          }
        },
        {
          "name": "Stage enriched state",
          "run": "mkdir -p enriched-state && mv pipeline-output enriched-state/"
        },
        {
          "uses": "./.github/actions/private-upload",
          "with": {
            "name": "primary-enriched-2026-11-13",
            "path": "enriched-state",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}",
            "retention-days": "7"
          }
        }
      ],
      "needs": "ledger"
    },
    "ledger": {
      "name": "Merge deterministic context ledger partitions",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 8,
      "env": {
        "OPENBLAS_NUM_THREADS": "1"
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "da8904d0fafa3bb59a53a31c887d292729911c66",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ github.sha }}",
            "path": "recovery-code",
            "persist-credentials": false
          }
        },
        {
          "name": "Use promoted privacy implementation",
          "run": "cp promoted/artifact.py scripts/privacy/artifact.py"
        },
        {
          "uses": "./.github/actions/private-download",
          "with": {
            "name": "ensemble-market-validation-2026-11-10",
            "run-id": "42920219240",
            "github-token": "${{ github.token }}",
            "path": "previous",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}"
          }
        },
        {
          "uses": "./.github/actions/private-download",
          "with": {
            "name": "primary-prepared-2026-11-13",
            "run-id": "43380667113",
            "github-token": "${{ github.token }}",
            "path": "prepared-state",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}"
          }
        },
        {
          "name": "Restore prepared state and partitions",
          "run": "mv prepared-state/pipeline-output pipeline-output"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install fixed dependency",
          "run": "python3 -m pip install numpy==2.3.5"
        },
        {
          "name": "Merge ledger partitions with unchanged rules",
          "env": {
            "PYTHONPATH": "${{ github.workspace }}/recovery-code/scripts:${{ github.workspace }}/experiments/ensemble_validation"
          },
          "run": "python3 \"$GITHUB_WORKSPACE/scripts/privacy/run_private.py\" <<'PRIVATE_COMMAND'\npython recovery-code/scripts/primary_serving_recovery.py ledger --output pipeline-output --previous previous --target-date '2026-11-13'\nPRIVATE_COMMAND"
        },
        {
          "name": "Stage ledger state",
          "run": "mkdir -p ledger-state && mv pipeline-output ledger-state/"
        },
        {
          "uses": "./.github/actions/private-upload",
          "with": {
            "name": "primary-ledger-2026-11-13",
            "path": "ledger-state",
            "key": "${{ secrets.PRIVATE_ARTIFACT_KEY }}",
            "retention-days": "7"
          }
        }
      ]
    }
  }
}
