name: Direct Outcome Learning (Artifacts Only)
on:
  push:
    branches: ['experiment/ensemble-market-validation']
    paths: ['experiments/ensemble_validation/outcome_learning.py', 'experiments/ensemble_validation/test_outcome_learning.py', '.github/workflows/direct-outcome-learning.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  learn:
    if: github.ref == 'refs/heads/experiment/ensemble-market-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - uses: actions/download-artifact@v4
        with:
          name: ensemble-market-validation-2026-10-12
          run-id: 38311913666
          github-token: ${{ github.token }}
          path: source
      - name: Verify independent learning and chronological boundaries
        run: python -m unittest discover -s experiments/ensemble_validation -v
      - name: Train through October 10, choose on 11, test on 12
        run: python experiments/ensemble_validation/outcome_learning.py --dataset source/rule-mining-dataset.json --output outcome-output --target-date 2026-10-13
      - uses: actions/upload-artifact@v4
        with:
          name: direct-outcome-learning-bootstrap
          path: outcome-output/
          if-no-files-found: error
          retention-days: 30
