name: History API smoke

on:
  workflow_dispatch:
  push:
    branches:
      - diagnose/nesine-history-network

permissions:
  contents: read

jobs:
  history-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Football history via HTTP
        run: mvn -q -f football/pom.xml clean compile exec:java -Dexec.mainClass=com.example.diagnostic.HistoryApiSmoke
      - name: Basketball history via HTTP
        run: mvn -q -f basketball/pom.xml clean compile exec:java -Dexec.mainClass=com.basketbol.diagnostic.HistoryApiSmoke
